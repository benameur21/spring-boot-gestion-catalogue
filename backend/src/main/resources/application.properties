# Application name
spring.application.name=gestion-catalogue

# Server port
server.port=8081

# MySQL database configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cataloguedb?createDatabaseIfNotExist=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}


# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===================================================================
# OPTION A: Configuration pour Ollama en Local (Llama 3.2)
# ===================================================================
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2

# ===================================================================
# OPTION B: Configuration pour Mistral AI dans le Cloud (Clé API)
