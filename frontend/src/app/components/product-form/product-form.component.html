
<div class="container">

  <div class="form-page-header">
    <div>
      <h1>{{ isEditMode ? 'Edit Product' : 'Add New Product' }}</h1>
      <p>
        {{ isEditMode
        ? 'Update the information of this product.'
        : 'Fill in the information below to add a new product.' }}
      </p>
    </div>

    <button type="button" class="back-btn" (click)="cancel()">
      ← Back to Products
    </button>
  </div>

  <div class="form-card">

    <div class="form-card-header">
      <h3>Product Information</h3>
      <p>Enter the product details.</p>
    </div>

    <form #productForm="ngForm" (ngSubmit)="saveProduct()">

      <div class="form-grid">

        <div class="form-group full-width">
          <label for="nom">Product Name <span>*</span></label>
          <input
            type="text"
            id="nom"
            name="nom"
            [(ngModel)]="product.nom"
            required
            placeholder="e.g. Dell Laptop">
        </div>

        <div class="form-group">
          <label for="prix">Price <span>*</span></label>
          <div class="input-with-suffix">
            <input
              type="number"
              id="prix"
              name="prix"
              [(ngModel)]="product.prix"
              required
              min="0"
              step="0.01"
              placeholder="0.00">
            <span>TND</span>
          </div>
        </div>

        <div class="form-group">
          <label for="quantite">Quantity <span>*</span></label>
          <input
            type="number"
            id="quantite"
            name="quantite"
            [(ngModel)]="product.quantite"
            required
            min="0"
            step="1"
            placeholder="0">
        </div>

        <div class="form-group full-width">
          <label for="categorie">Category <span>*</span></label>
          <select
            id="categorie"
            name="categorie"
            [ngModel]="product.categorie?.id"
            (ngModelChange)="onCategoryChange($event)"
            required>

            <option [ngValue]="undefined">Select a category</option>

            <option
              *ngFor="let category of categories"
              [ngValue]="category.id">
              {{ category.nom }}
            </option>

          </select>
        </div>

        <div class="form-group full-width">
          <label for="description">Description</label>
          <textarea
            id="description"
            name="description"
            [(ngModel)]="product.description"
            rows="4"
            placeholder="Write a short description of the product...">
          </textarea>
        </div>

      </div>

      <p *ngIf="errorMessage" class="error">
        {{ errorMessage }}
      </p>

      <div class="form-actions">
        <button
          type="button"
          class="cancel-btn"
          (click)="cancel()">
          Cancel
        </button>

        <button
          type="submit"
          class="save-btn"
          [disabled]="productForm.invalid">
          {{ isEditMode ? 'Update Product' : 'Save Product' }}
        </button>
      </div>

    </form>
  </div>
</div>
